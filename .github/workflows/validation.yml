name: validation

on:
  push:
    branches:
      - "**"
  workflow_call:

concurrency:
  group: validation-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  registry:
    name: registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: registry
        run: make registry

  bindings:
    name: bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: bindings
        run: make bindings

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: lint
        run: make lint

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: types
        run: make types

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: test
        run: make test-cov
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  sdk:
    name: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: sdk
        run: make sdk

  adapters:
    name: adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: adapters
        run: make adapters

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: build
        run: make build

  validate:
    name: validate
    if: always()
    needs: [registry, bindings, lint, types, test, sdk, adapters, build]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          set -eu
          for result in \
            ${{ needs.registry.result }} \
            ${{ needs.bindings.result }} \
            ${{ needs.lint.result }} \
            ${{ needs.types.result }} \
            ${{ needs.test.result }} \
            ${{ needs.sdk.result }} \
            ${{ needs.adapters.result }} \
            ${{ needs.build.result }}; do
            case "$result" in
              success) ;;
              *) echo "required job result=$result"; exit 1 ;;
            esac
          done
          echo "validate OK"
