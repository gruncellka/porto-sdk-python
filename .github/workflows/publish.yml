name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Package version that must match pyproject.toml (required for manual publish)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  validate:
    name: validate
    uses: ./.github/workflows/validation.yml

  version:
    name: version
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Assert version (tag or dispatch expected_version)
        run: |
          set -eu
          PKG="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXPECTED="${{ inputs.expected_version }}"
            test -n "$EXPECTED" || { echo "expected_version required"; exit 1; }
            test "$EXPECTED" = "$PKG" || {
              echo "expected_version=$EXPECTED != pyproject version=$PKG"; exit 1;
            }
          else
            TAG="${GITHUB_REF_NAME#v}"
            test "$TAG" = "$PKG" || {
              echo "tag=$TAG != pyproject version=$PKG"; exit 1;
            }
          fi
          echo "version OK: $PKG"

  artifact:
    name: artifact
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and smoke-install wheel
        run: make artifact
      - name: Upload PyPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-package
          path: dist/

  heavy:
    name: heavy
    needs: [version]
    uses: ./.github/workflows/heavy.yml
    secrets: inherit

  publish:
    name: publish
    needs: [artifact, heavy]
    if: >
      always() &&
      needs.artifact.result == 'success' &&
      needs.heavy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-package
          path: dist
      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release:
    name: release
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
