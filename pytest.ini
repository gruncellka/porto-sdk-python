[pytest]
testpaths = tests
python_files = test_*.py *_steps.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# BDD Configuration - features from gruncellka-porto-features package (see tests/porto_features_path.py)
# bdd_features_base_dir is resolved at runtime in test_bdd.py

# Test markers for tag-based filtering
markers =
    offline: Tests that don't call real API (safe, free, run always)
    online: Tests that call real API (costs money, run manually)
    api: API integration tests
    critical: Must pass before release
    sdk_bdd: Shared @sdk porto-features scenarios executed by test_bdd.py
    sdk: porto-features @sdk tag (pytest-bdd)
    core: porto-features @core tag (pytest-bdd)
    provider:deutschepost: porto-features provider tag (pytest-bdd)
    provider:ukrposhta: porto-features provider tag (pytest-bdd)
    provider:laposte: porto-features provider tag (pytest-bdd)
    provider:swisspost: porto-features provider tag (pytest-bdd)
    adapters: porto-features @adapters tag (pytest-bdd)
    wire:internetmarke: porto-features wire tag (pytest-bdd)
addopts = -m "offline or not online"
